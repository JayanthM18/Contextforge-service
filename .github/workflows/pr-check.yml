# Pull request: build the candidate, compare against the merge base's stored
# benchmark, comment, and pass or fail the check (docs/ARCHITECTURE.md,
# "Flow: pull request"). Make this check required in branch protection to
# block merges that regress quality.
name: pr-check

on:
  pull_request:
  # Re-run the check on an open pull request by hand, e.g. in dual mode to
  # confirm the cached verdict (stage 7's gate). No comment is posted; the
  # report is in the run summary and the artifact.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      mode:
        description: cached or dual
        type: choice
        options: [dual, cached]
        default: dual

concurrency:
  group: pr-check-${{ github.event.pull_request.number || inputs.pr }}-${{ inputs.mode || 'cached' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}

jobs:
  contextforge:
    runs-on: ubuntu-latest
    steps:
      # The pull request's own head, not GitHub's synthetic merge commit, so
      # the baseline is the merge base and a PR is not blamed for changes that
      # landed on main after it branched (docs/DESIGN.md section 3).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          fetch-depth: 0

      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }}"

      # Optional, as in benchmark.yml: reach a judge on a private tailnet.
      - name: Join the tailnet
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Optional, as in benchmark.yml: a self-hosted judge at JUDGE_HOST.
      - name: Point at the self-hosted judge
        id: judge
        env:
          JUDGE_HOST: ${{ secrets.JUDGE_HOST }}
        run: scripts/ci-judge-config.sh

      - uses: ./packages/action
        env:
          # The judge step may have set OPENAI_API_KEY for the sample app.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || env.OPENAI_API_KEY }}
        with:
          config: ${{ steps.judge.outputs.config || vars.CONTEXTFORGE_CONFIG || 'examples/contextforge.yml' }}
          mode: ${{ inputs.mode }}
          base-branch: ${{ github.base_ref || 'main' }}
