# ContextForge as a GitHub Action: a thin wrapper that maps inputs to CLI
# flags, posts the sticky comment and sets the check (docs/ARCHITECTURE.md).
#
# A composite action rather than a bundled JavaScript one: it builds the same
# CLI a developer runs locally, so there is no second artefact to drift.
name: ContextForge
description: Catch RAG quality regressions on pull requests before they merge.
author: ContextForge

branding:
  icon: check-circle
  color: green

inputs:
  config:
    description: Path to contextforge.yml, relative to the repository root.
    default: contextforge.yml
  mode:
    description: "cached or dual. Empty uses baseline.mode from the config."
    default: ""
  base-branch:
    description: The branch pull requests merge into.
    default: ${{ github.base_ref || 'main' }}
  output:
    description: Where results and reports are written.
    default: .contextforge
  comment:
    description: Post or update the sticky pull-request comment.
    default: "true"
  github-token:
    description: Token used to post the comment. Needs pull-requests write.
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "0 pass, 1 regression, 2 tool error."
    value: ${{ steps.run.outputs.exit-code }}
  results:
    description: Path to results.json, when a verdict was reached.
    value: ${{ steps.run.outputs.results }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 26

    - name: Install ContextForge
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: |
        npx --yes pnpm@10.34.5 install --frozen-lockfile
        npx --yes pnpm@10.34.5 build

    - name: Run the regression check
      id: run
      shell: bash
      env:
        CF_ROOT: ${{ github.action_path }}/../..
        CF_CONFIG: ${{ inputs.config }}
        CF_MODE: ${{ inputs.mode }}
        CF_BASE: ${{ inputs.base-branch }}
        CF_OUT: ${{ inputs.output }}
      run: |
        mkdir -p "$CF_OUT"
        args=(run --config "$CF_CONFIG" --base-branch "$CF_BASE" --output "$CF_OUT")
        if [ -n "$CF_MODE" ]; then args+=(--mode "$CF_MODE"); fi

        # Keep going on failure: the exit code is the verdict, and the comment
        # and artifact steps below must still run.
        set +e
        node "$CF_ROOT/packages/cli/dist/bin.js" "${args[@]}" 2> >(tee "$CF_OUT/error.log" >&2)
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$CF_OUT/results.json" ]; then echo "results=$CF_OUT/results.json" >> "$GITHUB_OUTPUT"; fi
        if [ -f "$CF_OUT/report.md" ]; then cat "$CF_OUT/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

    - name: Post the pull-request comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        CF_ROOT: ${{ github.action_path }}/../..
        CF_OUT: ${{ inputs.output }}
      run: node "$CF_ROOT/packages/action/dist/index.js" "$CF_OUT/report.md" "$CF_OUT/error.log"

    - name: Upload the reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: contextforge-report
        path: ${{ inputs.output }}
        if-no-files-found: ignore

    # The check status: pass (0), regression (1) and tool error (2) stay
    # distinct in the log even though GitHub shows both non-zero codes as red.
    - name: Report the verdict
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: |
        case "$CODE" in
          0) echo "ContextForge: no regression" ;;
          1) echo "::error::ContextForge: quality regression detected" ;;
          *) echo "::error::ContextForge could not reach a verdict (tool error, exit $CODE)" ;;
        esac
        exit "$CODE"
